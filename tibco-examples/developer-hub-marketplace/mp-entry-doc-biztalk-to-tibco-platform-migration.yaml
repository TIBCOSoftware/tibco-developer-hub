apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-doc-biztalk-to-tibco-platform-migration
  title: BizTalk to TIBCO Migration
  description: A strategic guide by TIBCO partner Behaim ITS for migrating from
    Microsoft BizTalk Server to the TIBCO Platform before BizTalk support ends
    (mainstream 2028, extended 2030). Covers mapping BizTalk components to TIBCO
    Platform equivalents (Orchestrations and Pipelines to BW6, Party
    Management/EDI/AS2 to BusinessConnect Container Edition, Message Box to
    EMS), an AI-assisted migration methodology using MCP servers to document
    existing BizTalk assets, and a 6-phase staged migration approach that lowers
    risk.
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: true
    popularity: 0
    isMultiInstall: false
    imageURL: https://www.behaimits.com/images/logos/behaim-logo.svg
    moreInfo:
      - text: BehaimITS
        url: https://www.behaimits.com/
        icon: chat
      - text: Full Technical Brief (PDF)
        url: https://behaimits.com/wp-content/uploads/BizTalk2TIBCO.pdf
        icon: docs
      - text: TIBCO Blog Post
        url: https://www.tibco.com/blog/2026/04/15/from-legacy-to-cloud-native-a-strategic-guide-to-biztalk-to-tibco-platform-migration/
        icon: docs
      - text: TIBCO Platform
        url: https://www.tibco.com/platform
        icon: star
  tags:
    - devhub-marketplace
    - biztalk
    - migration
    - modernization
    - businessworks
    - businessconnect
    - ems
    - partner-contribution
spec:
  owner: group:default/mp-behaim-its
  type: document
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  BizTalk to TIBCO Migration added to your TIBCO Developer Hub

            **ID:** mp-entry-doc-biztalk-to-tibco-platform-migration

            **Description:** A strategic guide by TIBCO partner Behaim ITS for migrating from Microsoft BizTalk Server to the TIBCO Platform before BizTalk support ends (mainstream 2028, extended 2030). Covers mapping BizTalk components to TIBCO Platform equivalents (Orchestrations and Pipelines to BW6, Party Management/EDI/AS2 to BusinessConnect Container Edition, Message Box to EMS), an AI-assisted migration methodology using MCP servers to document existing BizTalk assets, and a 6-phase staged migration approach that lowers risk. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/platform/biztalk-migration/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - title: Documents
        url: /docs?filters%5Buser%5D=all&limit=20
        icon: techdocs
      - icon: docs
        title: Open BizTalk Migration Docs
        url: /docs/default/system/biztalk-to-tibco-platform-migration
        type: openButton
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
