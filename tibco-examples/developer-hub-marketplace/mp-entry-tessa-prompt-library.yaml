apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-tessa-prompt-library
  title: TESSA Prompt Library
  description: "Get more out of TESSA, the TIBCO Enterprise Smart System Agent,
    with a curated set of prompts organised by what you are trying to find out:
    inventory and discovery, whole-environment health checks, per-application
    diagnosis, interactive CPU and memory charts, before/after trend comparison,
    troubleshooting, and governance reporting with your own rules applied. Every
    prompt has been run against a live environment, is environment-agnostic, and
    uses placeholders for your own application and data plane names. Includes a
    setup guide for activating TESSA and reviewing its MCP servers. TESSA is
    currently a preview capability."
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: true
    popularity: 0
    isMultiInstall: false
    imageURL: ""
    moreInfo:
      - text: TIBCO Developer Hub
        url: https://github.com/TIBCOSoftware/tibco-developer-hub
        icon: github
      - text: TIBCO Platform
        url: https://www.tibco.com/platform
        icon: star
  tags:
    - devhub-marketplace
    - artificial-intelligence
    - tessa
    - prompts
    - observability
    - ai-ops
    - mcp
spec:
  owner: group:default/marketplace-entries-group
  type: artificial-intelligence
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  TESSA Prompt Library added to your TIBCO Developer Hub

            **ID:** mp-entry-tessa-prompt-library

            **Description:** Get more out of TESSA, the TIBCO Enterprise Smart System Agent, with a curated set of prompts organised by what you are trying to find out: inventory and discovery, whole-environment health checks, per-application diagnosis, interactive CPU and memory charts, before/after trend comparison, troubleshooting, and governance reporting with your own rules applied. Every prompt has been run against a live environment, is environment-agnostic, and uses placeholders for your own application and data plane names. Includes a setup guide for activating TESSA and reviewing its MCP servers. TESSA is currently a preview capability. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/platform/tessa-prompt-library/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - title: Documents
        url: /docs?filters%5Buser%5D=all&limit=20
        icon: techdocs
      - icon: docs
        title: Open TESSA Prompt Library
        url: /docs/default/system/tessa-prompt-library
        type: openButton
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
