apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-doc-api-versioning-best-practices
  title: API Versioning Guide
  description: A best practices guide for modelling API versions in the TIBCO
    Developer Hub catalog. Backstage has no built-in concept of API versions, so
    version has to be modelled explicitly — this guide gives ten conventions for
    doing it, worked through the TIBCO Platform APIs, which publish thirteen
    releases side by side. Covers entity naming, freezing specifications,
    registering a release as a unit, lifecycle and succession metadata, grouping
    versions in the API Explorer, per-version TechDocs, consumer relations, CI
    enforcement, and the anti-patterns to avoid.
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: true
    popularity: 0
    isMultiInstall: false
    imageURL: ""
    moreInfo:
      - text: TIBCO Developer Hub
        url: https://github.com/TIBCOSoftware/tibco-developer-hub
        icon: github
      - icon: docs
        text: Backstage API entity model
        url: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
  tags:
    - devhub-marketplace
    - api
    - best-practices
    - versioning
    - governance
spec:
  owner: group:default/marketplace-entries-group
  type: document
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  API Versioning Guide added to your TIBCO Developer Hub

            **ID:** mp-entry-doc-api-versioning-best-practices

            **Description:** A best practices guide for modelling API versions in the TIBCO Developer Hub catalog. Backstage has no built-in concept of API versions, so version has to be modelled explicitly — this guide gives ten conventions for doing it, worked through the TIBCO Platform APIs, which publish thirteen releases side by side. Covers entity naming, freezing specifications, registering a release as a unit, lifecycle and succession metadata, grouping versions in the API Explorer, per-version TechDocs, consumer relations, CI enforcement, and the anti-patterns to avoid. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/developer-hub/best-practices/api-versioning/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - title: Documents
        url: /docs?filters%5Buser%5D=all&limit=20
        icon: techdocs
      - icon: docs
        title: Open API Versioning Best Practices
        url: /docs/default/system/api-versioning-best-practices
        type: openButton
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
