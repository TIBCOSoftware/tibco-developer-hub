apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-if-tibco-platform
  title: TIBCO Platform Import
  description: An Import Flow that reflects a live TIBCO Platform in the TIBCO
    Developer Hub catalog. The Control Plane becomes a Component, its Data
    Planes become sub-components, and every application becomes a sub-component
    of the Data Plane it runs on. Import the entire control plane or a single
    data plane, and commit the topology snapshot to GitHub so the catalog stays
    in sync on re-import.
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: true
    popularity: 0
    isMultiInstall: false
    imageURL: ""
    moreInfo:
      - text: TIBCO Platform
        url: https://www.tibco.com/platform
        icon: star
      - text: TIBCO Developer Hub
        url: https://github.com/TIBCOSoftware/tibco-developer-hub
        icon: github
  tags:
    - devhub-marketplace
    - tibco-platform
    - control-plane
    - data-plane
spec:
  owner: group:default/marketplace-entries-group
  type: import-flow
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  TIBCO Platform Import added to your TIBCO Developer Hub

            **ID:** mp-entry-if-tibco-platform

            **Description:** An Import Flow that reflects a live TIBCO Platform in the TIBCO Developer Hub catalog. The Control Plane becomes a Component, its Data Planes become sub-components, and every application becomes a sub-component of the Data Plane it runs on. Import the entire control plane or a single data plane, and commit the topology snapshot to GitHub so the catalog stays in sync on re-import. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/platform/import-flows/import-tibco-platform/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - title: Import Flows
        url: /import-flow?filters%5Bkind%5D=template&filters%5Buser%5D=all&limit=20
        icon: kind:template
      - icon: kind:template
        title: Run import flow for the TIBCO Platform
        url: /create/templates/default/import-tibco-platform
        type: openButton
      - icon: docs
        title: Import Flow Documentation
        url: /docs/default/template/import-tibco-platform
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
