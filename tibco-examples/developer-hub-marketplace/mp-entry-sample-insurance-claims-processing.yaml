apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-sample-insurance-claims-processing
  title: Insurance Claims Hub
  description: "An insurance claims-processing landscape modelled as a rich TIBCO
    Developer Hub catalog: policy admin, underwriting engine, document
    management, payments and fraud backends bridged to TIBCO EMS by BW6/Flogo
    apps orchestrating a First-Notice-of-Loss to payout flow, with claims
    message contracts exposed as first-class APIs. Purpose-built to showcase the
    Developer Hub Integration Topology view and change-impact analysis of what
    breaks if a claim schema changes across intake, underwriting, document and
    payout teams."
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: false
    popularity: 0
    isMultiInstall: false
    imageURL: ""
    moreInfo:
      - text: Documentation
        url: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/developer-hub/sample-systems/insurance-claims-processing/docs/index.md
        icon: docs
      - text: GitHub Repository
        icon: github
        url: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/developer-hub/sample-systems/insurance-claims-processing
  tags:
    - devhub-marketplace
    - insurance
    - claims
    - orchestration
    - ems
    - impact-analysis
    - topology
spec:
  owner: group:default/marketplace-entries-group
  type: sample
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  Insurance Claims Hub added to your TIBCO Developer Hub

            **ID:** mp-entry-sample-insurance-claims-processing

            **Description:** An insurance claims-processing landscape modelled as a rich TIBCO Developer Hub catalog: policy admin, underwriting engine, document management, payments and fraud backends bridged to TIBCO EMS by BW6/Flogo apps orchestrating a First-Notice-of-Loss to payout flow, with claims message contracts exposed as first-class APIs. Purpose-built to showcase the Developer Hub Integration Topology view and change-impact analysis of what breaks if a claim schema changes across intake, underwriting, document and payout teams. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/developer-hub/sample-systems/insurance-claims-processing/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - icon: catalog
        title: Open Integration Topology
        url: /catalog/default/system/claims-processing-hub/diagram
        type: openButton
      - icon: docs
        title: Documentation
        url: /docs/default/system/claims-processing-hub
      - icon: domain
        title: Insurance Domain
        url: /catalog/default/domain/insurance
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
