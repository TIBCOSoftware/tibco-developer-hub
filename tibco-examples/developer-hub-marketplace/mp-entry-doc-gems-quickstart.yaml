apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mp-entry-doc-gems-quickstart
  title: TIBCO GEMS Quickstart
  description: |-
    Get **TIBCO GEMS**, a comprehensive monitoring and management solution for TIBCO Enterprise Message Service. TIBCO GEMS is available as a standalone installation package and is delivered as part of the TIBCO Enterprise Message Service software.

    **TIBCO GEMS features:**

    - A straightforward command line interface for installing, running, managing, and uninstalling TIBCO GEMS environments.
    - An intuitive registration interface for the EMS Server Estate.
    - A modern graphical interface for viewing all servers, clients, and key metrics in the registered EMS estate.
    - Access to all EMS Server properties and the Admin CLI.
  backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/marketplace:
    isNew: true
    popularity: 0
    isMultiInstall: false
    imageURL: ""
    moreInfo:
      - text: TIBCO Developer Hub
        url: https://github.com/TIBCOSoftware/tibco-developer-hub
        icon: github
      - icon: docs
        text: TIBCO GEMS 1.1.0 documentation
        url: https://docs.tibco.com/pub/msg-gems/1.1.0/doc/html/
      - icon: docs
        text: TIBCO Enterprise Message Service
        url: https://docs.tibco.com/products/tibco-enterprise-message-service
  tags:
    - devhub-marketplace
    - ems
    - gems
    - messaging
    - monitoring
    - observability
spec:
  owner: group:default/marketplace-entries-group
  type: document
  presentation:
    buttonLabels:
      createButtonText: Get
  parameters:
    - title: Accept the Marketplace Entry
      required:
        - accept
      errorMessage: Please accept the Marketplace Entry
      properties:
        description:
          type: "null"
          description: |
            ## Get  TIBCO GEMS Quickstart added to your TIBCO Developer Hub

            **ID:** mp-entry-doc-gems-quickstart

            **Description:** Get **TIBCO GEMS**, a comprehensive monitoring and management solution for TIBCO Enterprise Message Service. TIBCO GEMS is available as a standalone installation package and is delivered as part of the TIBCO Enterprise Message Service software.

            **TIBCO GEMS features:**

            - A straightforward command line interface for installing, running, managing, and uninstalling TIBCO GEMS environments.
            - An intuitive registration interface for the EMS Server Estate.
            - A modern graphical interface for viewing all servers, clients, and key metrics in the registered EMS estate.
            - Access to all EMS Server properties and the Admin CLI. 

            Each item made available to you in the TIBCO® Developer Hub Marketplace is subject to its own individual license. You are responsible for reviewing the specific license terms that apply to each item that you access or use. Cloud Software Group, Inc. and its affiliates: (1) do not make any representation, promises, or guarantees about these items; and (2) are making these items available to you "AS IS," without any warranties or indemnities.
            This item is subject to the following [license](https://github.com/TIBCOSoftware/tibco-developer-hub/blob/main/LICENSE.TXT).

            **By accessing or using this item, you agree to assume full responsibility for its proper use and compliance with all applicable license terms.**
        accept:
          title: I Agree
          type: boolean
          default: null
          enum:
            - null
            - true
  steps:
    - id: registerItem
      name: Getting Marketplace Entry...
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/TIBCOSoftware/tibco-developer-hub-marketplace/blob/main/messaging/gems-quickstart/catalog-info.yaml
  output:
    links:
      - title: Open in catalog
        type: catalog
        icon: catalog
        entityRef: ${{ steps.registerItem.output.entityRef }}
      - title: Documents
        url: /docs?filters%5Buser%5D=all&limit=20
        icon: techdocs
      - icon: docs
        title: Open TIBCO GEMS Quickstart
        url: /docs/default/system/gems-quickstart
        type: openButton
      - title: Back to Marketplace
        url: /marketplace
        icon: dashboard
